[project]
name = "japanese-reader"
version = "0.1.0"
description = "Local-first Japanese reading + spaced-repetition desktop app"
requires-python = ">=3.11"
dependencies = [
    "sudachipy",
    "sudachidict_core",
    "jamdict",
    "jamdict-data",
    "jaconv",
    "fsrs",
    "trafilatura",
    "fastapi",
    "uvicorn",
    "pywebview",
    "genanki",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "httpx",
]

[tool.setuptools.packages.find]
include = ["server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Disable ROS' launch_testing pytest plugins, which leak in from a system
# /opt/ros install and crash collection ("unknown hook
# pytest_launch_collect_makemodule"). The entrypoint is registered as
# `launch_ros`; disabling it alongside `launch_testing` keeps collection clean.
addopts = ["-p", "no:launch_ros", "-p", "no:launch_testing"]

[tool.ruff]
target-version = "py311"
line-length = 100
